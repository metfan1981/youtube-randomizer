<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>@{{.Handle}} — {{.Count}} random</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 1rem; background: #111; color: #eee; }
    h1 { font-size: 1rem; font-weight: 400; opacity: 0.6; margin: 0 0 1rem; }
    .grid { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fit, minmax(360px, 1fr)); }
    .v { position: relative; aspect-ratio: 16 / 9; }
    .v iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  </style>
</head>
<body>
  <h1>@{{.Handle}} — refresh for new picks ({{.Count}} shown)</h1>
  <div class="grid">
    {{range .Videos}}
    <div class="v">
      <iframe
        src="https://www.youtube.com/embed/{{.}}"
        title="YouTube video player"
        allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture; fullscreen"
        allowfullscreen></iframe>
    </div>
    {{end}}
  </div>
</body>
</html>
